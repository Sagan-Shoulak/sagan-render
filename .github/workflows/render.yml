name: Renderer foundation

on:
  push:
    branches: [dev, main]
    paths: [".github/workflows/render.yml", "libraries/**", "examples/**", "shaders/**", "tests/**", "scripts/**", "third_party/**", "sagan-source-commit.txt"]
  pull_request:
    branches: [dev, main]
    paths: [".github/workflows/render.yml", "libraries/**", "examples/**", "shaders/**", "tests/**", "scripts/**", "third_party/**", "sagan-source-commit.txt"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-window-tests:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          path: render
          persist-credentials: false
      - name: Resolve compiler source pin
        id: source
        shell: bash
        working-directory: render
        run: |
          sha="$(tr -d '\r\n' < sagan-source-commit.txt)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: Sagan-Shoulak/sagan
          ref: ${{ steps.source.outputs.sha }}
          path: sagan-source
          fetch-depth: 0 # Version calculation requires the baseline commit history.
          persist-credentials: false
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make unzip mingw-w64-ucrt-x86_64-binutils mingw-w64-ucrt-x86_64-gcc
      - name: Build pinned compiler
        shell: msys2 {0}
        working-directory: sagan-source
        run: make -j2 bin/sagan
      - name: Run auto-closing window checks
        shell: msys2 {0}
        working-directory: render
        run: |
          export SAGAN_EXECUTABLE="$(cygpath -u "$GITHUB_WORKSPACE")/sagan-source/bin/sagan.exe"
          export SAGAN_PACKAGE_INDEX="$PWD/libraries/index.tsv"
          bash tests/integration/compiler_resolver_test.sh
          bash tests/integration/shadercross_lock_test.sh
          bash tests/integration/shader_toolchain_plan_test.sh
          bash tests/integration/material_contract_test.sh
          bash tests/integration/ui_contract_test.sh
          bash tests/integration/scene_contract_test.sh
          bash tests/integration/scene_demo_test.sh
          bash tests/integration/ui_gpu_demo_test.sh
          bash tests/integration/loading_demo_test.sh
          bash tests/integration/toolbar_demo_test.sh
          bash tests/integration/window_contract_test.sh
          bash tests/integration/window_bridge_test.sh
          bash tests/integration/shape_text_test.sh
          bash tests/integration/sdl_window_probe_test.sh
          bash tests/integration/sdl_gpu_triangle_probe_test.sh
      - uses: actions/upload-artifact@v6
        with:
          name: renderer-foundation-windows
          path: |
            render/build/sdl-window/sdl-window.bmp
            render/build/sdl-gpu/sdl-gpu-triangle.bmp
            render/build/sdl-gpu/sdl-gpu-report.txt
            render/build/ui-contract/ui-layout.svg
            render/build/scene-contract/scene-camera.svg
            render/build/scene-sagan-demo-test/scene-idle.bmp
            render/build/scene-sagan-demo-test/scene-reframed.bmp
            render/build/scene-sagan-demo-test/scene-demo-report.txt
            render/build/ui-sagan-demo/ui-sagan-960x540.bmp
            render/build/ui-sagan-demo/ui-sagan-800x600.bmp
            render/build/ui-sagan-demo/ui-sagan-demo-report.txt
            render/build/loading-sagan-demo/loading-960x540.bmp
            render/build/loading-sagan-demo/ready-800x600.bmp
            render/build/loading-sagan-demo/transition-1024x576.bmp
            render/build/loading-sagan-demo/failed-960x540.bmp
            render/build/loading-sagan-demo/loading-demo-report.txt
            render/build/toolbar-sagan-demo/keyboard-primary-960x540.bmp
            render/build/toolbar-sagan-demo/pointer-primary-960x540.bmp
            render/build/toolbar-sagan-demo/focus-forward-960x540.bmp
            render/build/toolbar-sagan-demo/disabled-960x540.bmp
            render/build/toolbar-sagan-demo/hover-reset-960x540.bmp
            render/build/toolbar-sagan-demo/pressed-reset-960x540.bmp
            render/build/toolbar-sagan-demo/vertical-640x600.bmp
            render/build/toolbar-sagan-demo/toolbar-demo-report.txt
          if-no-files-found: error

  portable-sdl-window-probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve compiler source pin
        id: source
        shell: bash
        run: |
          sha="$(tr -d '\r\n' < sagan-source-commit.txt)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: Sagan-Shoulak/sagan
          ref: ${{ steps.source.outputs.sha }}
          path: sagan-source
          fetch-depth: 0
          persist-credentials: false
      - name: Install Linux display and SDL build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xvfb mesa-vulkan-drivers vulkan-tools libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libdbus-1-dev libudev-dev libgl1-mesa-dev libegl1-mesa-dev
      - name: Install macOS build dependency
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Build pinned compiler
        working-directory: sagan-source
        run: make -j2 bin/sagan
      - name: Build SDL and run Linux window probe under Xvfb
        if: runner.os == 'Linux'
        run: |
          export SAGAN_EXECUTABLE="$GITHUB_WORKSPACE/sagan-source/bin/sagan"
          bash tests/integration/compiler_resolver_test.sh
          bash tests/integration/shadercross_lock_test.sh
          bash tests/integration/shader_toolchain_plan_test.sh
          bash tests/integration/material_contract_test.sh
          bash tests/integration/ui_contract_test.sh
          bash tests/integration/scene_contract_test.sh
          xvfb-run --auto-servernum bash tests/integration/scene_demo_portable_test.sh
          xvfb-run --auto-servernum bash tests/integration/ui_gpu_demo_portable_test.sh
          xvfb-run --auto-servernum bash tests/integration/loading_demo_portable_test.sh
          xvfb-run --auto-servernum bash tests/integration/toolbar_demo_portable_test.sh
          xvfb-run --auto-servernum bash tests/integration/sdl_window_probe_portable_test.sh
          xvfb-run --auto-servernum bash tests/integration/sdl_gpu_triangle_probe_portable_test.sh
      - name: Build SDL and run macOS window probe
        if: runner.os == 'macOS'
        run: |
          export SAGAN_EXECUTABLE="$GITHUB_WORKSPACE/sagan-source/bin/sagan"
          bash tests/integration/compiler_resolver_test.sh
          bash tests/integration/shadercross_lock_test.sh
          bash tests/integration/shader_toolchain_plan_test.sh
          bash tests/integration/material_contract_test.sh
          bash tests/integration/ui_contract_test.sh
          bash tests/integration/scene_contract_test.sh
          bash tests/integration/scene_demo_portable_test.sh
          bash tests/integration/ui_gpu_demo_portable_test.sh
          bash tests/integration/loading_demo_portable_test.sh
          bash tests/integration/toolbar_demo_portable_test.sh
          bash tests/integration/sdl_window_probe_portable_test.sh
          bash tests/integration/sdl_gpu_triangle_probe_portable_test.sh
      - uses: actions/upload-artifact@v6
        with:
          name: renderer-foundation-${{ runner.os }}
          path: |
            build/sdl-window/sdl-window.bmp
            build/sdl-gpu/sdl-gpu-triangle.bmp
            build/sdl-gpu/sdl-gpu-report.txt
            build/ui-contract/ui-layout.svg
            build/scene-contract/scene-camera.svg
            build/scene-sagan-demo-test/scene-idle.bmp
            build/scene-sagan-demo-test/scene-reframed.bmp
            build/scene-sagan-demo-test/scene-demo-report.txt
            build/ui-sagan-demo/ui-sagan-960x540.bmp
            build/ui-sagan-demo/ui-sagan-800x600.bmp
            build/ui-sagan-demo/ui-sagan-demo-report.txt
            build/loading-sagan-demo/loading-960x540.bmp
            build/loading-sagan-demo/ready-800x600.bmp
            build/loading-sagan-demo/transition-1024x576.bmp
            build/loading-sagan-demo/failed-960x540.bmp
            build/loading-sagan-demo/loading-demo-report.txt
            build/toolbar-sagan-demo/keyboard-primary-960x540.bmp
            build/toolbar-sagan-demo/pointer-primary-960x540.bmp
            build/toolbar-sagan-demo/focus-forward-960x540.bmp
            build/toolbar-sagan-demo/disabled-960x540.bmp
            build/toolbar-sagan-demo/hover-reset-960x540.bmp
            build/toolbar-sagan-demo/pressed-reset-960x540.bmp
            build/toolbar-sagan-demo/vertical-640x600.bmp
            build/toolbar-sagan-demo/toolbar-demo-report.txt
          if-no-files-found: error
